name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: rv
            musl_arch: riscv64
          - arch: la
            musl_arch: loongarch64
    uses: ./.github/workflows/test-template.yml
    with:
      arch: ${{ matrix.arch }}
      musl_arch: ${{ matrix.musl_arch }}
    secrets: inherit

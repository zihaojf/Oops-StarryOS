name: Test Template

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      musl_arch:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-20
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-targets: false

      - uses: arceos-org/setup-musl@v1
        with:
          arch: ${{ inputs.musl_arch }}

      # make <arch> runs `prepare` first (recreates .cargo/config.toml from
      # config.toml.temp) and then builds kernel-<arch>.
      - name: Build
        run: make ${{ inputs.arch }}

      - uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ inputs.arch }}
          path: kernel-*

  # The runtime half of the upstream workflow needs sdcard-<arch>.img, which is
  # a 4 GiB competition image and is deliberately not in this repository. Boot
  # tests and scoring live in the sibling `oskernel-eval` repo instead:
  #   git clone <oskernel-eval> && make rv && make points

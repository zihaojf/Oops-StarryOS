name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins one exact nightly; installing "just nightly"
      # here would leave the pinned toolchain without rustfmt.
      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-20
          components: rustfmt, rust-src, llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch  = make target (this repo builds rv/la only)
          # musl  = setup-musl 的架构名（rv/la 不是它认识的取值）
          - arch: rv
            musl: riscv64
            target: riscv64gc-unknown-none-elf
          - arch: la
            musl: loongarch64
            target: loongarch64-unknown-none-softfloat
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-20
          components: clippy, rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - uses: arceos-org/setup-musl@v1
        with:
          arch: ${{ matrix.musl }}

      # The submission pipeline drops .cargo/, so `make prepare` recreates
      # .cargo/config.toml (vendored sources + offline) before cargo runs.
      - name: Prepare cargo config
        run: make prepare

      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} -F qemu -- -D warnings -A unused
